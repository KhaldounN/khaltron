<style>
body{margin:0;background:#05070A}
a{color:#35E0FF}a:hover{color:#9BF0FF}
.stage{--c:#35E0FF}
.stage.mode-hunt{--c:#FF3B3B}
.stage svg *{transition:fill .5s,stroke .5s,opacity .5s,stop-color .5s}

.mode-hunt .shake{animation:shake .18s linear infinite}
.grade{opacity:0;transition:opacity .8s;mix-blend-mode:color}
.mode-hunt .grade{opacity:.38}
.darken{opacity:0;transition:opacity .8s}
.mode-hunt .darken{opacity:.3}
.eyeglow{opacity:.45;mix-blend-mode:screen;animation:pulse 2.6s ease-in-out infinite}
.mode-hunt .eyeglow{opacity:.9;animation-duration:.5s}
.redeye{opacity:0;transition:opacity .35s}
.mode-hunt .redeye{opacity:1}
.pupil{transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.lid{opacity:0;transform:translateY(-10px);transition:transform .45s cubic-bezier(.5,0,.2,1),opacity .3s}
.mode-hunt .lid{opacity:1;transform:translateY(0)}
.beam{transform-box:view-box;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.beam.bl{transform-origin:931px 94px}.beam.br{transform-origin:987px 91px}
.beam-cone{opacity:.45}
.mode-hunt .beam-cone{opacity:.9;animation:flicker .12s steps(2) infinite}
.laser{opacity:0}
.mode-hunt .laser{opacity:1}
.look-0 .pupil{transform:translate(-2.5px,.6px)}.look-0 .beam{transform:rotate(87deg)}
.look-1 .pupil{transform:translate(-2.2px,.6px)}.look-1 .beam{transform:rotate(86.3deg)}
.look-2 .pupil{transform:translate(-2px,.6px)}.look-2 .beam{transform:rotate(85.2deg)}
.look-3 .pupil{transform:translate(2px,.6px)}.look-3 .beam{transform:rotate(-85.2deg)}
.look-4 .pupil{transform:translate(2.2px,.6px)}.look-4 .beam{transform:rotate(-86.3deg)}
.look-5 .pupil{transform:translate(2.5px,.6px)}.look-5 .beam{transform:rotate(-87deg)}
.look-c .pupil{transform:translate(0,1px)}.look-c .beam.bl{transform:rotate(86deg) scaleX(7)}.look-c .beam.br{transform:rotate(-86deg) scaleX(7)}.look-c .laser{opacity:0}

.mode-hunt .card{border-color:rgba(255,59,59,.5);background:rgba(26,6,8,.82)}
.card.targeted{border-color:rgba(53,224,255,.85);box-shadow:0 0 22px rgba(53,224,255,.25)}

.card.s-paused{background:rgba(18,5,7,.9);animation:pauseflash .7s ease-out}

.only-hunt{display:none}

.vignette{opacity:0;transition:opacity .6s}

.toggle{cursor:pointer;transition:background-color .3s,border-color .3s,color .3s}

.phase-locked .shake,.phase-locked .eyeglow,.phase-locked .vignette,.phase-locked .banner,.phase-locked .beam-cone{animation:none !important}
.phase-locked .mote{animation-play-state:paused}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

<script type="text/x-dc" data-dc-script data-props='{"startInGamingMode":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { look: 2, hunt: false, phase: 'watch', warned: -1 };
  }
  componentDidMount() {
    this.alive = true;
    if (this.props && this.props.startInGamingMode) this.engage();
    else this.idle(1200);
  }
  componentWillUnmount() {
    this.alive = false;
    clearTimeout(this.timer);
  }
  later(fn, ms) {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { if (this.alive) fn(); }, ms);
  }
  idle(delay) {
    const step = () => {
      if (this.state.phase !== 'watch') return;
      let n = this.state.look;
      while (n === this.state.look) n = Math.floor(Math.random() * 6);
      this.setState({ look: n });
      this.later(step, 1800);
    };
    this.later(step, delay);
  }
  engage() {
    this.setState({ hunt: true, phase: 'sweep', look: 0, warned: -1 });
    const sweep = (k) => {
      this.setState({ look: k });
      this.later(() => {
        this.setState({ warned: k });
        if (k < 5) this.later(() => sweep(k + 1), 260);
        else this.later(() => {
          this.setState({ phase: 'pausing', look: 'c' });
          this.later(() => this.setState({ phase: 'locked' }), 1300);
        }, 800);
      }, 380);
    };
    this.later(() => sweep(0), 450);
  }
  disengage() {
    this.setState({ hunt: false, phase: 'watch', warned: -1, look: 2 });
    this.idle(1200);
  }
  renderVals() {
    const hunt = this.state.hunt;
    const look = this.state.look;
    const phase = this.state.phase;
    const warned = this.state.warned;
    const statusOf = (i) => {
      if (phase === 'watch') return 'monitored';
      if (phase === 'sweep') return i <= warned ? 'warned' : 'scanning';
      return 'paused';
    };
    const base = [
      { name: 'Chrome', tag: 'BROWSER', load: 'l4' },
      { name: 'Slack', tag: 'CHAT', load: 'l2' },
      { name: 'Outlook', tag: 'MAIL', load: 'l2' },
      { name: 'Teams', tag: 'MEETINGS', load: 'l3' },
      { name: 'OneDrive', tag: 'SYNC', load: 'l1' },
      { name: 'Spotify', tag: 'MUSIC', load: 'l1' }
    ];
    return {
      look: look,
      modeClass: hunt ? 'mode-hunt' : 'mode-watch',
      phaseClass: 'phase-' + phase,
      modeName: phase === 'watch' ? 'MONITOR MODE // WATCHING' : (phase === 'sweep' ? 'GAMING MODE // ISSUING WARNINGS' : 'GAMING MODE // ALL PROCESSES PAUSED'),
      bannerText: phase === 'sweep' ? 'GAMING MODE ENGAGED — ISSUING WARNINGS' : 'ALL NON-ESSENTIAL PROCESSES PAUSED',
      buttonLabel: hunt ? 'EXIT GAMING MODE' : 'GAMING MODE',
      pressed: hunt ? 'true' : 'false',
      toggle: () => (this.state.hunt ? this.disengage() : this.engage()),
      procs: base.map((p, i) => {
        const targeted = (phase === 'watch' || phase === 'sweep') && i === look;
        return { ...p, cls: 'card c' + i + ' s-' + statusOf(i) + (targeted ? ' targeted' : '') };
      })
    };
  }
}
</script>
